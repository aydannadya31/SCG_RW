<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing sound rings -->
  <circle cx="256" cy="240" r="160" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" fill="none" opacity="0.3" />
  <circle cx="256" cy="240" r="190" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 16" fill="none" opacity="0.2" />

  <!-- Microphone capsule -->
  <rect x="208" y="140" width="96" height="170" rx="48" fill="url(#micGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.3))" />
  
  <!-- Microphone Stand / Arc -->
  <path d="M168 250 C168 316, 344 316, 344 250" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  <line x1="256" y1="316" x2="256" y2="380" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  <line x1="200" y1="380" x2="312" y2="380" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
</svg>
